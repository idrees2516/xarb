[workspace]
resolver = "2"
members = [
    "crates/xarb-core",
    "crates/xarb-hft",
    "crates/xarb-feed",
    "crates/xarb-poly",
    "crates/xarb-engine",
    "crates/xarb-server",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
anyhow = "1"
libc = "0.2"
arc-swap = "1"
xarb-core = { path = "crates/xarb-core" }
xarb-hft = { path = "crates/xarb-hft" }
xarb-feed = { path = "crates/xarb-feed" }
xarb-poly = { path = "crates/xarb-poly" }
xarb-engine = { path = "crates/xarb-engine" }

[profile.release]
opt-level = 3
debug = false
codegen-units = 1
lto = "thin"
